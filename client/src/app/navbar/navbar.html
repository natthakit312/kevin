<mat-toolbar class="my-navbar">
    <button mat-button routerLink="/" class="home-btn" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>home</mat-icon>
        <span>Kevin</span>
    </button>

    <span class="spacer"></span>

    <div class="nav-links">
        <button mat-button [matMenuTriggerFor]="menu" class="profile-btn">
            <img [src]="avatar_url()" class="avatar" alt="User Avatar">
            <span>{{ display_name() }}</span>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item [routerLink]="profile_link()">
                <mat-icon>account_circle</mat-icon>
                <span>Profile</span>
            </button>
            @if (passport.data()?.displayName) {
            <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Logout</span>
            </button>
            }
        </mat-menu>
    </div>
</mat-toolbar>
